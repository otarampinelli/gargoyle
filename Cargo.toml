[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/otarampinelli/gargoyle"

# Every dependency version lives here, once. Crates opt in with `foo.workspace = true`.
[workspace.dependencies]
gargoyle-core = { path = "crates/gargoyle-core", version = "0.1.0" }
gargoyle-git = { path = "crates/gargoyle-git", version = "0.1.0" }
thiserror = "2.0.21"
toml = "1.1.8"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
globset = "0.4.20"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.0.0"
serde_json = "1.0.154"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# dev
assert_cmd = "2.2.2"
tempfile = "3.27.0"


[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Stricter than default:
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true